hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.connection.driver_class = com.mysql.cj.jdbc.Driver
hibernate.show-sql = true

# Use `create` so Hibernate recreates the schema on each run.  This is
# necessary during development to ensure that new entities and fields
# are reflected in the database.  In production you may wish to use
# `update` instead to avoid dropping existing tables.
hibernate.hbm2ddl.auto = create 

# Configure the correct database name and locale options.  The
# `lilach_shop` schema will be created automatically by Hibernate when
# using `hibernate.hbm2ddl.auto=create`.
hibernate.connection.url=jdbc:mysql://localhost:3306/lilach_shop?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
hibernate.connection.timezone = UTC
hibernate.connection.username = root

hibernate.connection.password = NewPassword123!